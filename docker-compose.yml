services:
  api:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    image: claude-code-api:latest
    container_name: claude-code-api
    restart: unless-stopped
    # Reap the CLI child processes.
    init: true
    env_file:
      - .env
    ports:
      # Bound to localhost by default: put Caddy/nginx in front for TLS, or set
      # BIND=0.0.0.0 in .env once you understand who can reach the port.
      - "${BIND:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      # Claude login state. Survives rebuilds — this is what holds your session.
      - claude-config:/home/node/.claude
      # Conversation map + the sandbox working directory.
      - claude-data:/data
      # Live-edit agents and prompts without rebuilding the image.
      - ./config:/app/config:ro
    # Each concurrent turn is a Node process holding a model context; two of
    # them plus the gateway fits comfortably in 2 GB.
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  claude-config:
  claude-data:
